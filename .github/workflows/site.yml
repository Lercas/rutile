name: site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0', cache: npm, cache-dependency-path: site/package-lock.json}
      - run: npm ci
        working-directory: site
      - run: npm audit --omit=dev
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm run validate
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with: {path: site/dist}
      - id: deployment
        uses: actions/deploy-pages@v4
