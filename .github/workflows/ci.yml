name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25'}
      - run: go vet ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -exclude=G104,G204,G304,G702,G703 ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - run: go test -race ./...
      - run: bash scripts/smoke.sh
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.19.0', cache: npm, cache-dependency-path: site/package-lock.json}
      - run: npm ci
        working-directory: site
      - run: npm audit --omit=dev
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm run validate
        working-directory: site
