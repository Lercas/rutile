<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" role="img" aria-label="Architecture: CLI, MCP stdio and HTTP clients talk to the rutile daemon over a unix socket; only the daemon holds the decrypted age key in memory; encrypted files on disk">
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><polygon points="0,0 10,4 0,8" fill="#9B937F"/></marker>
  </defs>
  <rect x="1" y="1" width="878" height="398" rx="10" fill="#0F0D0A" stroke="#2E2921" stroke-width="2"/>

  <text x="30" y="36" font-size="10.5" fill="#4A4437" letter-spacing="1">CLIENTS — THIN, NO CRYPTO / POLICY LOGIC</text>
  <g font-size="12.5">
    <rect x="30" y="50" width="220" height="54" rx="8" fill="#1A1713" stroke="#2E2921" stroke-width="1.5"/>
    <text x="46" y="73" fill="#EDE8DF">human — CLI</text>
    <text x="46" y="92" fill="#9B937F" font-size="11">rutile add / show / allow</text>

    <rect x="30" y="122" width="220" height="54" rx="8" fill="#1A1713" stroke="#2E2921" stroke-width="1.5"/>
    <text x="46" y="145" fill="#EDE8DF">agents — MCP stdio</text>
    <text x="46" y="164" fill="#9B937F" font-size="11">claude code · cursor · zed</text>

    <rect x="30" y="194" width="220" height="54" rx="8" fill="#1A1713" stroke="#2E2921" stroke-width="1.5"/>
    <text x="46" y="217" fill="#EDE8DF">network — MCP HTTP</text>
    <text x="46" y="236" fill="#9B937F" font-size="11">TLS · mTLS · SPIFFE · Bearer</text>
  </g>

  <line x1="320" y1="40" x2="320" y2="260" stroke="#2E2921" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="320" y="280" text-anchor="middle" font-size="11" fill="#9B937F">daemon.sock</text>
  <text x="320" y="296" text-anchor="middle" font-size="10" fill="#4A4437">0600 · peer-cred</text>

  <path d="M250 77 H388" stroke="#9B937F" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M250 149 H388" stroke="#9B937F" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <path d="M250 221 H388" stroke="#9B937F" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>

  <rect x="390" y="50" width="460" height="230" rx="10" fill="#17140F" stroke="#3A332A" stroke-width="2"/>
  <text x="410" y="80" font-size="14" fill="#EDE8DF">rutile daemon — the trust boundary</text>

  <g font-size="11.5">
    <rect x="410" y="98" width="205" height="46" rx="6" fill="#1E1A14" stroke="#2E2921"/>
    <text x="424" y="117" fill="#EDE8DF">policy: default-deny</text>
    <text x="424" y="134" fill="#9B937F" font-size="10.5">globs · ttl · one-time</text>

    <rect x="627" y="98" width="205" height="46" rx="6" fill="#1E1A14" stroke="#2E2921"/>
    <text x="641" y="117" fill="#EDE8DF">delegation</text>
    <text x="641" y="134" fill="#9B937F" font-size="10.5">child in parent · ttl &lt; 24h</text>

    <rect x="410" y="156" width="205" height="46" rx="6" fill="#1E1A14" stroke="#2E2921"/>
    <text x="424" y="175" fill="#EDE8DF">audit: hash chain</text>
    <text x="424" y="192" fill="#9B937F" font-size="10.5">every call, denials too</text>

    <rect x="627" y="156" width="205" height="46" rx="6" fill="#1E1A14" stroke="#2E2921"/>
    <text x="641" y="175" fill="#EDE8DF">requests</text>
    <text x="641" y="192" fill="#9B937F" font-size="10.5">human approve / reject</text>
  </g>

  <rect x="410" y="216" width="422" height="46" rx="8" fill="#2A2212" stroke="#E8B84B" stroke-width="1.5"/>
  <text x="424" y="236" font-size="12.5" fill="#E8B84B">age key — decrypted ONLY here, in memory</text>
  <text x="424" y="253" font-size="10.5" fill="#9B937F">unlock via scrypt passphrase · auto-lock after 30m idle</text>

  <path d="M635 280 V308" stroke="#9B937F" stroke-width="1.3" fill="none" marker-end="url(#ar)"/>
  <text x="30" y="322" font-size="10.5" fill="#4A4437" letter-spacing="1">DISK — ~/.rutile · GIT REPO · ENCRYPTED OR SECRET-FREE</text>
  <g font-size="11">
    <rect x="30" y="334" width="190" height="42" rx="6" fill="#1A1713" stroke="#2E2921"/>
    <text x="44" y="352" fill="#9B937F">store/**.age</text>
    <text x="44" y="368" fill="#4A4437" font-size="10">secrets, age-encrypted</text>
    <rect x="234" y="334" width="190" height="42" rx="6" fill="#1A1713" stroke="#2E2921"/>
    <text x="248" y="352" fill="#9B937F">identities.age</text>
    <text x="248" y="368" fill="#4A4437" font-size="10">key, scrypt-encrypted</text>
    <rect x="438" y="334" width="190" height="42" rx="6" fill="#1A1713" stroke="#2E2921"/>
    <text x="452" y="352" fill="#9B937F">policy.yaml · agents/*</text>
    <text x="452" y="368" fill="#4A4437" font-size="10">rules · sha256 of tokens</text>
    <rect x="642" y="334" width="190" height="42" rx="6" fill="#1A1713" stroke="#2E2921"/>
    <text x="656" y="352" fill="#9B937F">audit.log</text>
    <text x="656" y="368" fill="#4A4437" font-size="10">hash-chained JSONL</text>
  </g>
</svg>
